name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar
        run: unzip -q ninjaclient-atualizado.zip

      - name: Corrigir settings.gradle
        working-directory: ninjaclient
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'ninjaclient'
          EOF

      - name: Corrigir nomes de metodos 1.21.11
        working-directory: ninjaclient/src/main/java/com/meuclient
        run: |
          sed -i '42s/getPos()/getEntityPos()/' PlayerTracker.java
          sed -i '38s/isFallFlying()/isGliding()/' modules/NoFall.java
          sed -i '44s/getPos()/getCameraPos()/' modules/ESPLine.java
          sed -i '60s/getPos()/getCameraPos()/' modules/ESPVida.java
          sed -i '41s/getPos()/getCameraPos()/' modules/ESPMob.java
          sed -i '43s/getPos()/getCameraPos()/' modules/BoxESP.java
          sed -i '139s/getPos()/getEntityPos()/' modules/AutoAnchor.java
          sed -i '274s/getPos()/getEntityPos()/' modules/AutoAnchor.java
          sed -i '151s/getPos()/getEntityPos()/' modules/AutoCrystal.java
          sed -i '82s/getPos()/getEntityPos()/' modules/KillMob.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: ninjaclient
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient-jar
          path: ninjaclient/build/libs/*.jar
